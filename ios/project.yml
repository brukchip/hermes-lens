name: HermesLens
options:
  bundleIdPrefix: com.example.hermeslens
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 6.0
    # Set your own Apple Developer team ID here before running `xcodegen`
    # (see README.md › Build).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    # Placeholder. Put the App ID from your Meta Wearables Developer Center app
    # here (or override it locally) to use the glasses outside Developer Mode.
    META_APP_ID: "0"
    # Bundle identifier and URL scheme. Change both if you fork the app; the URL
    # scheme must match the one registered for your Meta app.
    HERMES_BUNDLE_ID: com.example.hermeslens
    HERMES_URL_SCHEME: hermeslens
    # Optional server address baked into the build. Leave empty to enter it
    # during onboarding or in Settings.
    HERMES_DEFAULT_BRIDGE_URL: ""
packages:
  HermesLensCore:
    path: Packages/HermesLensCore
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

targets:
  HermesLens:
    type: application
    platform: iOS
    sources:
      - path: HermesLensApp
    dependencies:
      - package: HermesLensCore
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
      - package: MetaWearables
        product: MWDATInputs
    info:
      path: HermesLensApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(HERMES_APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(HERMES_URL_SCHEME)
        HermesDefaultBridgeURL: $(HERMES_DEFAULT_BRIDGE_URL)
        HermesUsesMocksByDefault: $(HERMES_USES_MOCKS_BY_DEFAULT)
        LSApplicationQueriesSchemes:
          - fb-viewapp
        MWDAT:
          AppLinkURLScheme: $(HERMES_URL_SCHEME)://
          MetaAppID: $(META_APP_ID)
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
        NSBluetoothAlwaysUsageDescription: Luna uses Bluetooth to connect to your Meta glasses.
        NSMicrophoneUsageDescription: Luna listens only while you are talking to her, after you tap Talk to Luna.
        NSLocalNetworkUsageDescription: Luna uses a private local connection to receive photos and video from your Meta glasses.
        NSContactsUsageDescription: Luna fills in a new contact from a business card; you check it and tap Done to save it.
        NSPhotoLibraryAddUsageDescription: Luna adds a photo or video to your Photos library only when you tap Save to Photos.
        NSBonjourServices:
          - _bonjour._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - external-accessory
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HERMES_APP_DISPLAY_NAME: Luna
        HERMES_USES_MOCKS_BY_DEFAULT: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID)
        PRODUCT_MODULE_NAME: HermesLens
        PRODUCT_NAME: HermesLens
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets:
        - HermesLensTests
        - HermesLensUITests
  HermesLensUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HermesLensUITests
    dependencies:
      - target: HermesLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID).uitests
        TEST_TARGET_NAME: HermesLens
  HermesLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesLensTests
    dependencies:
      - target: HermesLens
      - package: HermesLensCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMES_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HermesLens.app/HermesLens"
        BUNDLE_LOADER: "$(TEST_HOST)"
